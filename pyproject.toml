[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitstat"
version = "1.0.0"
description = "Offline contribution analytics from a local git history: author table, weekly heat, file density. Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["git", "analytics", "cli", "statistics", "churn"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control",
]

[project.scripts]
gitstat = "gitstat.cli:main"

[tool.setuptools.packages.find]
include = ["gitstat*"]
